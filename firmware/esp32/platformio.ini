; PlatformIO — alternativa al IDE de Arduino (opcional, para quien lo prefiera).
; Uso:  pio run           (compilar)
;       pio run -t upload (subir al ESP32)
;       pio device monitor (ver el monitor serie)
;
; Si usas el IDE de Arduino en su lugar, ignora este archivo: solo instala las
; librerías listadas en el encabezado de esp32_gemelo_digital.ino.

[env:esp32dev]
platform = espressif32
board = esp32dev            ; ESP32 DevKit V1 (ESP-WROOM-32)
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit Unified Sensor@^1.1
    claws/BH1750@^1.3
    wifwaf/MH-Z19@^1.5
    adafruit/Adafruit MLX90640@^1.1
